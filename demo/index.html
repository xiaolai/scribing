<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <title>Scribing</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <h1 class="title">Scribing</h1>
    <p><a href="multilingual/">Explore offline multilingual practice</a></p>
    <form class="js-char-form char-form">
      <label>
        Character
        <input
          type="text"
          class="js-char char-input"
          size="2"
          value="我"
          aria-describedby="character-help status"
          required
        />
      </label>
      <button type="submit">Update</button>
    </form>
    <p id="character-help">
      Enter one Chinese character. Character data loads from jsDelivr.
    </p>
    <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <div class="actions">
      <button class="js-toggle" disabled aria-pressed="false">Show/hide</button>
      <button class="js-toggle-hint" disabled aria-pressed="true">Outline on/off</button>
      <button class="js-animate" disabled>Animate</button>
      <button class="js-quiz" disabled>Quiz yourself</button>
    </div>

    <div id="target" aria-label="Character writing area" aria-busy="true"></div>

    <script type="application/javascript" src="../dist/scribing.js"></script>
    <script type="application/javascript" src="test.js"></script>
  </body>
</html>
