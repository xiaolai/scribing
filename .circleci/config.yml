version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-node22-{{ checksum "yarn.lock" }}
      - run: yarn install --frozen-lockfile
      - save_cache:
          paths:
            - node_modules
          key: v2-node22-{{ checksum "yarn.lock" }}
      - run: yarn typecheck
      - run: yarn lint-test
      - run: yarn test --runInBand
      - run: yarn build
      - run: yarn check-demo
      - run: yarn check-package

# Publishing is intentionally manual until the fork's npm ownership and release
# policy are established. CI must never publish automatically from master.
workflows:
  verify:
    jobs:
      - build
